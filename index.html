<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Search movies by title or genre and see ratings, plot and cast." />
  <title>Movie Night | Find your next movie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <script src="https://kit.fontawesome.com/51214fba6d.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <nav class="site-nav">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="./">
        <i class="fa-solid fa-film" aria-hidden="true"></i>
        Movie Night
      </a>
      <a class="nav-link-muted" href="https://github.com/natale565/movie-night" target="_blank" rel="noopener">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
        <span class="d-none d-sm-inline">Source</span>
      </a>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1 class="hero-title">Find your next movie night pick</h1>
      <p class="hero-subtitle">Search any title for ratings, plot and cast, or browse popular movies by genre.</p>

      <form id="movieName" class="search-bar" role="search">
        <label class="visually-hidden" for="movieTitleInput">Movie title</label>
        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
        <input id="movieTitleInput" type="search" class="search-input" placeholder="Search by movie title, e.g. Inception"
          autocomplete="off" autofocus />
        <button type="submit" class="btn btn-accent">Search</button>
      </form>

      <button type="button" class="btn btn-ghost mt-3" data-bs-toggle="modal" data-bs-target="#formModal">
        <i class="fa-solid fa-masks-theater me-2" aria-hidden="true"></i>Browse by genre
      </button>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row g-4">
      <aside class="col-lg-3 order-2 order-lg-1">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title"><i class="fa-regular fa-clock me-2" aria-hidden="true"></i>Recent searches</h2>
            <button id="clearSearches" type="button" class="btn btn-link btn-sm link-muted p-0 d-none">Clear</button>
          </div>
          <div id="previous-title-searches" class="recent-list"></div>
        </div>
      </aside>

      <section class="col-lg-9 order-1 order-lg-2" aria-live="polite">
        <div id="statusMessage"></div>
        <div id="movieResults"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Movie data from <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb</a>
      and <a href="https://rapidapi.com/" target="_blank" rel="noopener">Advanced Movie Search</a>.
    </div>
  </footer>

  <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="formModalLabel">Browse by genre</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="taskForm">
          <div class="modal-body">
            <label for="movieGenre" class="form-label">Pick a genre</label>
            <select class="form-select form-select-lg" id="movieGenre" required>
              <option value="">Select a genre</option>
            </select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent">Show movies</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./assets/js/script.js"></script>
</body>

</html>
